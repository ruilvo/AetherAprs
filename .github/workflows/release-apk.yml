name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One pinned Android build-tools version for both the APK build and its
  # verification, so the tools that sign and the tools that check cannot drift.
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - name: Reject a release that already exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the tag instead of republishing a version code."
            exit 1
          fi

      - name: Extract version from tag
        id: version
        run: |
          chmod +x .github/scripts/extract-version.sh
          OUTPUT=$(.github/scripts/extract-version.sh "${GITHUB_REF#refs/tags/}")
          echo "$OUTPUT" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Install workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore AetherAprs.slnx

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Verifying keystore..."
          test -s "${{ github.workspace }}/release.keystore"
          keytool -list -keystore "${{ github.workspace }}/release.keystore" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null

      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        shell: bash
        run: |
          set -euo pipefail

          # MSBuild turns an environment variable into a property, so the signing
          # values reach the Android targets without ever appearing on a command
          # line, where every process on the runner could read them.
          export AndroidSigningKeyStore="$ANDROID_KEYSTORE_PATH"
          export AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          export AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
          export AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD"

          BUILD_LOG="$RUNNER_TEMP/release-build.log"

          dotnet publish AetherAprs.Android/AetherAprs.Android.csproj \
            -c Release \
            -f net11.0-android \
            -r android-arm64 \
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version_name }} \
            -p:AndroidKeyStore=true \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkBuildToolsVersion="$ANDROID_BUILD_TOOLS_VERSION" \
            2>&1 | tee "$BUILD_LOG"

          # Masking is only worth claiming when it is proven per run: a secret that
          # reached the log is already public in the run it leaked into.
          for secret in "$ANDROID_KEY_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD"; do
            if [ -n "$secret" ] && grep -qF -- "$secret" "$BUILD_LOG"; then
              echo "::error::A signing password appeared in the build log; masking is not working."
              exit 1
            fi
          done
      
      - name: Verify ReadyToRun images
        shell: bash
        run: |
          set -euo pipefail
          R2R_DIR="AetherAprs.Android/obj/Release/net11.0-android/android-arm64/R2R"
          if [ ! -d "$R2R_DIR" ] || [ -z "$(find "$R2R_DIR" -name '*.r2r.dll' -print -quit)" ]; then
            echo "::error::No composite ReadyToRun image was produced; the release APK would ship JIT-only code."
            exit 1
          fi
          ls -lh "$R2R_DIR"

      - name: Verify build output
        run: |
          echo "=== Checking build output directory ==="
          find AetherAprs.Android/bin/Release -name "*.apk" -o -name "*.aab"

      - name: Find and Verify APK
        id: find_apk
        shell: bash
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "::error::Android build-tools $ANDROID_BUILD_TOOLS_VERSION is not installed at $BUILD_TOOLS_DIR."
            ls -1 "$ANDROID_HOME/build-tools" || true
            exit 1
          fi

          # The publish step names its signed package, so require exactly that one
          # artifact instead of guessing the newest APK in the tree.
          mapfile -t CANDIDATES < <(find AetherAprs.Android/bin/Release/net11.0-android -type f -name "*-Signed.apk" | sort)
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::No signed APK was produced; the release has nothing to publish."
            find AetherAprs.Android/bin/Release -type f -name "*.apk" -print || true
            exit 1
          fi
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed APK but found ${#CANDIDATES[@]}; refusing to pick one."
            printf '  %s\n' "${CANDIDATES[@]}"
            exit 1
          fi

          APK_PATH="${CANDIDATES[0]}"
          echo "Using signed APK: $APK_PATH"

          "$BUILD_TOOLS_DIR/zipalign" -c -P 4 4 "$APK_PATH"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK_PATH"

          BADGING=$("$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH")
          echo "$BADGING" | grep -E "package:|sdkVersion:"

          # The artifact must carry the version code the tag implies; otherwise a
          # stale or misbuilt package would ship under a new release name.
          ACTUAL_VERSION_CODE=$(echo "$BADGING" | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p")
          if [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::The signed APK reports versionCode '$ACTUAL_VERSION_CODE', which does not match '$EXPECTED_VERSION_CODE' from the tag."
            exit 1
          fi

          # Keep the release asset name deterministic.
          APK_NAME="AetherAprs-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_name }}
            ${{ steps.find_apk.outputs.checksum_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.version_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.find_apk.outputs.apk_name }}

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rm -f "${{ github.workspace }}/release.keystore"
          rm -f "${{ github.workspace }}/*.keystore"
          rm -f "$RUNNER_TEMP/release-build.log"

          # Prove the workspace is clean instead of assuming the removal worked;
          # a later step could otherwise archive the keystore by accident.
          LEFTOVER=$(find "${{ github.workspace }}" -maxdepth 4 -name "*.keystore" -print -quit)
          if [ -n "$LEFTOVER" ]; then
            echo "::error::Signing material was left in the workspace at $LEFTOVER."
            exit 1
          fi
