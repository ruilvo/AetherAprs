name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          chmod +x .github/scripts/extract-version.sh
          OUTPUT=$(.github/scripts/extract-version.sh "${GITHUB_REF#refs/tags/}")
          echo "$OUTPUT" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore AetherAprs.slnx

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Verifying keystore..."
          ls -lh ${{ github.workspace }}/release.keystore
          
          echo "Listing keystore contents..."
          keytool -list -v -keystore ${{ github.workspace }}/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -30
          
          echo ""
          echo "Checking for alias '$KEY_ALIAS'..."
          if keytool -list -keystore ${{ github.workspace }}/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "✓ Alias '$KEY_ALIAS' found in keystore"
          else
            echo "✗ ERROR: Alias '$KEY_ALIAS' NOT found in keystore"
            echo ""
            echo "Available aliases in keystore:"
            keytool -list -keystore ${{ github.workspace }}/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" | grep "Alias name:" || echo "Could not list aliases"
            echo ""
            echo "Please update the ANDROID_KEY_ALIAS secret to match an alias in your keystore."
            echo "Common value: aetheraprs"
            exit 1
          fi

      - name: Build APK
        run: |
          dotnet publish AetherAprs.Android/AetherAprs.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version_name }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ github.workspace }}/release.keystore \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkBuildToolsVersion=34.0.0 \
            --verbosity detailed | tee build.log
          
          # Check if signing was mentioned in the build
          if grep -q "jarsigner" build.log || grep -q "apksigner" build.log; then
            echo "✓ Build log indicates APK was signed"
          else
            echo "⚠ Warning: Build log doesn't mention signing tools"
          fi
      
      - name: Verify build output
        run: |
          echo "=== Checking build output directory ==="
          find AetherAprs.Android/bin/Release -name "*.apk" -o -name "*.aab"

      - name: Find and Verify APK
        id: find_apk
        run: |
          APK_PATH=$(find AetherAprs.Android/bin/Release/net10.0-android -name "*.apk" | grep -E "(Signed|publish)" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No signed APK found!"
            echo "Looking for any APK files..."
            find AetherAprs.Android/bin/Release -name "*.apk"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"
          
          # Verify APK
          echo ""
          echo "=== APK Information ==="
          ls -lh "$APK_PATH"
          
          echo ""
          echo "=== APK Details (aapt) ==="
          $ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | head -25
          
          echo ""
          echo "=== APK Signature Check (jarsigner) ==="
          if jarsigner -verify -verbose -certs "$APK_PATH" 2>&1 | tee verify.log; then
            echo ""
            if grep -q "jar verified" verify.log; then
              echo "✓ APK is properly signed"
            else
              echo "⚠ APK signature status unclear"
              cat verify.log
            fi
          else
            echo "✗ APK verification failed"
            cat verify.log
            
            echo ""
            echo "=== Attempting manual signing ==="
            # Backup original
            cp "$APK_PATH" "${APK_PATH}.unsigned"
            
            # Align
            $ANDROID_HOME/build-tools/*/zipalign -v -p 4 "${APK_PATH}.unsigned" "${APK_PATH}.aligned"
            
            # Sign with apksigner
            $ANDROID_HOME/build-tools/*/apksigner sign \
              --ks ${{ github.workspace }}/release.keystore \
              --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
              --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "$APK_PATH" \
              "${APK_PATH}.aligned"
            
            # Verify again
            if jarsigner -verify "$APK_PATH"; then
              echo "✓ APK manually signed and verified"
            else
              echo "✗ Manual signing failed"
              exit 1
            fi
          fi
          
          # Rename APK to include version
          APK_NAME="AetherAprs-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.version_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
