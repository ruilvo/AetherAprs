name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          chmod +x .github/scripts/extract-version.sh
          OUTPUT=$(.github/scripts/extract-version.sh "${GITHUB_REF#refs/tags/}")
          echo "$OUTPUT" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore AetherAprs.slnx

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Verify keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "Verifying keystore..."
          test -s "${{ github.workspace }}/release.keystore"
          keytool -list -keystore "${{ github.workspace }}/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build APK
        run: |
          dotnet publish AetherAprs.Android/AetherAprs.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r android-arm64 \
            -p:ApplicationVersion=${{ steps.version.outputs.version_code }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version_name }} \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=${{ github.workspace }}/release.keystore \
            -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidSdkBuildToolsVersion=34.0.0
      
      - name: Verify build output
        run: |
          echo "=== Checking build output directory ==="
          find AetherAprs.Android/bin/Release -name "*.apk" -o -name "*.aab"

      - name: Find and Verify APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find AetherAprs.Android/bin/Release/net10.0-android -name "*.apk" | grep -E "(Signed|publish)" | sort -V | tail -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No signed APK found!"
            echo "Looking for any APK files..."
            find AetherAprs.Android/bin/Release -name "*.apk"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"
          
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -c -P 4 4 "$APK_PATH"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | grep -E "package:|sdkVersion:"
          # Keep the release asset name deterministic.
          APK_NAME="AetherAprs-v${{ steps.version.outputs.version_name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_name=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"

          echo "Found and verified: $APK_PATH"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_name }}
            ${{ steps.find_apk.outputs.checksum_name }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version_name, '-') }}
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.version_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release APK
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.find_apk.outputs.apk_name }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/release.keystore
