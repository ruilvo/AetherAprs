name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Build solution
        run: dotnet build AetherAprs.slnx

      - name: Run tests
        run: dotnet test AetherAprs.Tests/AetherAprs.Tests.csproj

      - name: Check for vulnerable packages
        run: dotnet list AetherAprs.slnx package --vulnerable --include-transitive
        continue-on-error: true
