name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore AetherAprs.slnx

      - name: Build solution
        run: dotnet build AetherAprs.slnx --no-restore

      - name: Run tests
        run: dotnet test AetherAprs.Tests/AetherAprs.Tests.csproj --no-build

      - name: Check architecture boundaries
        run: >
          dotnet test AetherAprs.Tests/AetherAprs.Tests.csproj --no-build
          --filter "FullyQualifiedName~AetherAprs.Tests.Architecture"

      - name: Build Android instrumentation APK
        run: dotnet build AetherAprs.Android.Tests/AetherAprs.Android.Tests.csproj -c Release --no-restore

      - name: Check repository whitespace
        run: git diff --check

      - name: Check for vulnerable packages
        run: python3 .github/scripts/check_vulnerable_packages.py AetherAprs.slnx

      # The release workflow only generates the SBOM at tag time, so prove here that
      # the generator still understands the resolved build instead of finding out on
      # a release run.
      - name: Check SBOM generation
        run: |
          python3 .github/scripts/generate_sbom.py generate \
            --project AetherAprs.Android/AetherAprs.Android.csproj \
            --output "$RUNNER_TEMP/build.cdx.json" \
            --version-name 0.0.0-ci \
            --version-code 0
          python3 .github/scripts/generate_sbom.py verify \
            --sbom "$RUNNER_TEMP/build.cdx.json" \
            --version-name 0.0.0-ci \
            --version-code 0
